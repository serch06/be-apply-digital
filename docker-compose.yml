version: '3.9'

services:
  postgres_db:
    image: postgres:16
    restart: always
    container_name: postgres_db
    env_file:
      - ./server/.env
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  be_apply_digital:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: be_apply_digital
    depends_on:
      - postgres_db
    env_file:
      - ./server/.env
    ports:
      - '3000:3000'
    command: npm run start:prod

volumes:
  pgdata:
